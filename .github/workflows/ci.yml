name: Nanobot CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - docs/**
      - .agent/**
      - .github/ISSUE_TEMPLATE/**
      - AGENTS.md
      - CLAUDE.md
      - COMMUNICATION.md
      - CONTRIBUTING.md
      - README.md
      - SECURITY.md
      - webui/README.md
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - docs/**
      - .agent/**
      - .github/ISSUE_TEMPLATE/**
      - AGENTS.md
      - CLAUDE.md
      - COMMUNICATION.md
      - CONTRIBUTING.md
      - README.md
      - SECURITY.md
      - webui/README.md
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      python_required: ${{ steps.paths.outputs.python_required }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Python-relevant changes
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python_required=true

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            diff_range="${BASE_SHA}...${HEAD_SHA}"
          else
            diff_range="${BASE_SHA}..${HEAD_SHA}"
          fi

          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null &&
            changed_files="$(git diff --name-only --no-renames "$diff_range")" &&
            [[ -n "$changed_files" ]] &&
            ! grep -qvE '^(webui/|nanobot/channels/[^/]+/webui/|docs/)' <<< "$changed_files"; then
            python_required=false
          fi

          echo "python_required=$python_required" >> "$GITHUB_OUTPUT"

  test:
    name: Python (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.python_required == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum, 3.11
            os: ubuntu-latest
            python-version: "3.11"
            coverage: false
            pytest_args: ""
          - name: latest, 3.14 + coverage
            os: ubuntu-latest
            python-version: "3.14"
            coverage: true
            pytest_args: ""
          - name: Windows, 3.14
            os: windows-latest
            python-version: "3.14"
            coverage: false
            # Keep each test file in one worker while using both hosted-runner cores.
            pytest_args: "-n 2 --dist loadfile"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install channel dependencies
        run: uv run --no-sync python -m scripts.install_channel_dependencies --all-channels

      - name: Verify dependency consistency
        run: uv pip check

      # Channel requirements live in manifests rather than uv.lock. Avoid a
      # later uv run sync pruning the packages installed by the previous step.
      - name: Lint with ruff
        if: matrix.coverage
        run: uv run --no-sync ruff check nanobot tests conftest.py

      - name: Type check with BasedPyright (strict)
        if: matrix.coverage
        run: uv run --no-sync basedpyright

      - name: Run tests with coverage
        if: matrix.coverage
        run: >-
          uv run --no-sync python -m pytest
          --cov=nanobot --cov-report=term-missing:skip-covered
          --durations=25 --durations-min=1.0

      - name: Run compatibility tests
        if: ${{ !matrix.coverage }}
        run: >-
          uv run --no-sync python -m pytest
          ${{ matrix.pytest_args }}
          --durations=25 --durations-min=1.0

  webui:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Verify npm lockfile
        working-directory: webui
        run: npm ci --ignore-scripts --dry-run

      - name: Install WebUI dependencies
        working-directory: webui
        run: bun install --frozen-lockfile

      - name: Lint WebUI
        working-directory: webui
        run: bun run lint

      - name: Test WebUI
        working-directory: webui
        run: bun run test

      - name: Build WebUI
        working-directory: webui
        run: bun run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build image with default channel dependencies
        run: docker build -t nanobot:test .

      - name: Verify default WhatsApp dependencies
        run: docker run --rm --entrypoint python nanobot:test -c "import neonize, segno"

      - name: Verify runtime dependency permissions
        run: >-
          docker run --rm --user 1000:1000 --entrypoint sh nanobot:test -c
          'test -w /app/.venv && test ! -w /app && test ! -w /app/nanobot &&
          python -m scripts.install_channel_dependencies discord && python -c "import discord"'

  # Phase 0: Infrastructure Validation
  validate-infrastructure:
    name: Validate Infrastructure Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose files
        run: |
          docker compose -f docker-compose.infra.yml config --quiet
          echo "✓ Infrastructure Docker Compose is valid"

      - name: Check required files exist
        run: |
          test -f nanobot/flags.py || exit 1
          test -f nanobot/logging.py || exit 1
          test -d migrations/ || exit 1
          echo "✓ All required Phase 0 files exist"

  # Integration Tests for Async Tool Execution
  integration-test-async:
    name: Integration Tests - Async Tools
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest pytest-asyncio httpx aiofiles redis

      - name: Run async integration tests
        env:
          NANOBOT_FLAG_ASYNC_TOOLS: true
          NANOBOT_FLAG_PARALLEL_TOOLS: true
          NANOBOT_FLAG_TOOL_TIMEOUT: true
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/agent/ tests/tools/ \
            -k "async or parallel or timeout" \
            --asyncio-mode=auto \
            -v || true

  # Summary
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [changes, validate-infrastructure, test, integration-test-async]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## 📊 Pipeline Summary"
          echo ""
          echo "✅ Infrastructure Validation: ${{ needs.validate-infrastructure.result }}"
          echo "✅ Tests: ${{ needs.test.result }}"
          echo "✅ Integration Tests (Async): ${{ needs.integration-test-async.result }}"
          echo ""
          echo "🎯 All Phase 0 requirements validated!"
