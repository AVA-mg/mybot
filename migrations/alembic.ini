# Alembic Migration Configuration for Nanobot

[alembic]
# Path to migration scripts
script_location = migrations

# Database URL - can be overridden via environment variable
sqlalchemy.url = postgresql://nanobot:nanobot@localhost:5432/nanobot

# Pre- and post-exec hooks for migrations
prepend_sys_path = .
version_path_separator = os

# Template for migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s

# Whether to truncate slug in filename
truncate_slug_length = 40

# Set to 'true' to run the environment script in a transaction
transaction_per_migration = false

# Include timestamps in migration files
include_timestamps = true

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
