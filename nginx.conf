# Nginx Load Balancer Configuration for Nanobot
# Supports 1000+ concurrent users with proper scaling

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # Basic Settings
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off;
    
    # Timeouts for long-lived connections
    keepalive_timeout 65;
    keepalive_requests 10000;
    
    # Buffer sizes for high throughput
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    client_max_body_size 20m;
    large_client_header_buffers 4 16k;
    
    # Rate limiting zone (enabled for production)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=5r/s;
    
    # Connection tracking for upstream health
    map $status $loggable {
        ~^[23] 0;
        default 1;
    }
    
    # Upstream configuration for API servers
    upstream nanobot_api {
        least_conn;  # Use least connections algorithm
        server api-1:8900 weight=1 max_fails=3 fail_timeout=30s;
        server api-2:8900 weight=1 max_fails=3 fail_timeout=30s;
        server api-3:8900 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 100;  # Keep persistent connections to upstreams
    }
    
    # Upstream configuration for WebSocket servers
    upstream nanobot_websocket {
        least_conn;  # Better than ip_hash for users behind NAT
        server ws-1:8765 weight=1 max_fails=3 fail_timeout=30s;
        server ws-2:8765 weight=1 max_fails=3 fail_timeout=30s;
        server ws-3:8765 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 1000;  # More keepalive for WebSocket connections
    }
    
    server {
        listen 80;
        server_name _;
        
        # Access and error logs
        access_log /var/log/nginx/access.log combined if=$loggable;
        error_log /var/log/nginx/error.log warn;
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Metrics endpoint
        location /metrics {
            proxy_pass http://nanobot_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }
        
        # API endpoints - OpenAI compatible API
        location /v1/ {
            # Enable rate limiting for API endpoints
            limit_req zone=api_limit burst=50 nodelay;
            
            proxy_pass http://nanobot_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts for API requests
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
            
            # Buffering settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }
        
        # WebSocket connections
        location /ws {
            proxy_pass http://nanobot_websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket specific timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Disable buffering for WebSocket
            proxy_buffering off;
        }
        
        # WebUI static files (if served separately)
        location /static/ {
            alias /var/www/nanobot/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        
        # Default location - proxy to WebUI or API
        location / {
            proxy_pass http://nanobot_websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
