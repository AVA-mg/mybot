x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NANOBOT_CHANNELS: ${NANOBOT_CHANNELS:-whatsapp}
  volumes:
    - ~/.nanobot:/home/nanobot/.nanobot
  cap_drop:
    - ALL

x-api-config: &api-config
  <<: *common-config
  command:
    ["serve", "--host", "0.0.0.0", "-w", "/home/nanobot/.nanobot/api-workspace"]
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: 1G
      reservations:
        cpus: "0.25"
        memory: 256M

x-ws-config: &ws-config
  <<: *common-config
  command: ["gateway"]
  restart: unless-stopped
  ports: []  # Ports handled by nginx load balancer
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: 1G
      reservations:
        cpus: "0.25"
        memory: 256M

services:
  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: nanobot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3
      - ws-1
      - ws-2
      - ws-3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # API Service Replicas (for horizontal scaling)
  api-1:
    <<: *api-config
    container_name: nanobot-api-1
    networks:
      - nanobot-network

  api-2:
    <<: *api-config
    container_name: nanobot-api-2
    networks:
      - nanobot-network

  api-3:
    <<: *api-config
    container_name: nanobot-api-3
    networks:
      - nanobot-network

  # WebSocket Service Replicas (for horizontal scaling)
  ws-1:
    <<: *ws-config
    container_name: nanobot-ws-1
    networks:
      - nanobot-network

  ws-2:
    <<: *ws-config
    container_name: nanobot-ws-2
    networks:
      - nanobot-network

  ws-3:
    <<: *ws-config
    container_name: nanobot-ws-3
    networks:
      - nanobot-network

  # Redis for session management and caching (optional but recommended)
  redis:
    image: redis:7-alpine
    container_name: nanobot-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - nanobot-network

  # CLI service (on-demand)
  nanobot-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
    networks:
      - nanobot-network

networks:
  nanobot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  redis-data:
    driver: local
